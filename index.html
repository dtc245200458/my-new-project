<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành grid-gap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS grid-gap</h1>
    <section>
        <h2>Ví dụ 1: Khoảng cách hàng và cột bằng nhau</h2>
        <p><code>grid-gap: 20px;</code> — khoảng cách giữa các hàng và giữa các cột đều là 20px.</p>
        <div class="grid-container example-one">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </section>
    <section>
        <h2>Ví dụ 2: Khoảng cách hàng và cột khác nhau</h2>
        <p><code>grid-gap: 30px 10px;</code> — khoảng cách hàng là 30px, khoảng cách cột là 10px.</p>
        <div class="grid-container example-two">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </section>
</body>
</html>
