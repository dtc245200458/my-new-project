<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký người dùng với Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script defer src="script.js"></script>
</head>
<body class="bg-light">
    <main class="container py-4 py-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <div class="card shadow-sm">
                    <div class="card-body p-3 p-md-4">
                        <h1 class="h3 text-center">Đăng ký người dùng</h1>
                        <p class="text-muted text-center">Vui lòng điền thông tin bên dưới để đăng ký.</p>
                        <form id="registrationForm" method="post">
                            <div class="mb-3">
                                <label for="fullname" class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" id="fullname" name="fullname" autocomplete="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" aria-describedby="passwordHelp" required>
                                <div id="passwordHelp" class="form-text text-muted">Sử dụng ít nhất 8 ký tự.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirm_password" autocomplete="new-password" required>
                            </div>
                            <fieldset class="mb-3">
                                <legend class="fs-6">Giới tính</legend>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                                    <label class="form-check-label" for="male">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="female" value="female" required>
                                    <label class="form-check-label" for="female">Nữ</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="other" value="other" required>
                                    <label class="form-check-label" for="other">Khác</label>
                                </div>
                            </fieldset>
                            <fieldset class="mb-3">
                                <legend class="fs-6">Sở thích</legend>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="reading" value="reading">
                                    <label class="form-check-label" for="reading">Đọc sách</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="sports" value="sports">
                                    <label class="form-check-label" for="sports">Thể thao</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="hobby" id="coding" value="coding">
                                    <label class="form-check-label" for="coding">Lập trình</label>
                                </div>
                            </fieldset>
                            <div class="mb-3">
                                <label for="country" class="form-label">Quốc gia</label>
                                <select class="form-select" id="country" name="country" required>
                                    <option value="" selected disabled>Chọn quốc gia</option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="US">Hoa Kỳ</option>
                                    <option value="OTHER">Khác</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Đăng ký</button>
                            <p class="small text-muted mt-3 mb-0">Form thực hành giao diện; thông tin không được gửi đến server hay lưu lại.</p>
                            <div id="result" class="alert alert-success mt-3 mb-0" role="status" hidden></div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
