<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bố Cục 3 Cột bằng Bootstrap Grid và Flexbox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p>Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary p-3 text-white">
                <p>Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-3">
                <p>Phần 3</p>
            </div>
        </div>
    </div>
    <div class="container my-5 py-3">
        <h3 class="text-center">Khoảng cách được điều chỉnh bằng Margin &amp; Padding</h3>
    </div>
    <div class="d-none d-md-block bg-warning text-center p-3">
        <p>Nội dung này chỉ hiển thị trên màn hình lớn hơn hoặc bằng 768px</p>
    </div>
    <div id="myCarousel" class="carousel slide mt-5" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="image1.jpg" class="d-block w-100" width="1440" height="480" alt="Hình ảnh 1">
            </div>
            <div class="carousel-item">
                <img src="image2.jpg" class="d-block w-100" width="1440" height="480" alt="Hình ảnh 2">
            </div>
            <div class="carousel-item">
                <img src="image3.jpg" class="d-block w-100" width="1440" height="480" alt="Hình ảnh 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev" aria-label="Hình ảnh trước">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next" aria-label="Hình ảnh tiếp theo">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </div>
    <div class="container mt-5">
        <h3><i class="fas fa-home" aria-hidden="true"></i> Trang chủ</h3>
    </div>
    <form class="container mt-5" method="post" id="contactForm">
        <div class="mb-3">
            <label for="name" class="form-label">Họ và tên</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Nhập họ và tên">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Nhập email">
        </div>
        <div class="mb-3">
            <label for="message" class="form-label">Nội dung</label>
            <textarea class="form-control" id="message" name="message" rows="4" placeholder="Nhập nội dung"></textarea>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane" aria-hidden="true"></i> Gửi</button>
        <p class="text-muted mt-3" id="formResult" role="status" hidden></p>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
