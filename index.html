<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS flex-grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Thực hành CSS flex-grow</h1>
    <p>Trong 5 Flex Item, ô thứ hai nhận toàn bộ không gian còn trống với flex-grow: 1.</p>
    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
        <div class="item">Item 5</div>
    </div>
    <p>Các ô có flex-basis: 80px. Bốn ô còn lại có flex-grow: 0 (giá trị mặc định).</p>
</body>
</html>
